# Пример конфигурации nginx (reverse proxy перед Next.js).
# Скопируйте в /etc/nginx/sites-available/cdek-calculator и включите:
#
#   sudo cp deploy/nginx-example.conf /etc/nginx/sites-available/cdek-calculator
#   sudo ln -s /etc/nginx/sites-available/cdek-calculator /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS обязателен: в production сессионная cookie ставится с флагом Secure
# и по «голому» http работать не будет. Проще всего выпустить сертификат
# через certbot:  sudo certbot --nginx -d calc.example.com

server {
    listen 80;
    server_name calc.example.com; # замените на ваш домен

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
